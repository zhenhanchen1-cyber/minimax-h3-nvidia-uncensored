name: 📊 提交实测数据（推荐）
description: 把你的显卡 + 耗时 + 显存占用发出来，帮后面的人少走弯路
title: "[实测] RTX ____ / ____ 秒 / ____ GiB"
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        这个仓库的性能表靠社区实测补全 —— 你填的每一行都对后来者有直接价值。
        填完我会把你的数据整理进 README 的实测表（会署名你的 GitHub ID）。
  - type: input
    id: gpu
    attributes:
      label: 显卡型号 + 显存
      placeholder: RTX 4090 24GB / RTX 4060 Ti 16GB / 双卡 3090 ...
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: 系统内存
      placeholder: 32GB / 64GB
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: 主模型 + 文本编码器
      placeholder: 融合 turbo int8 21G + eraiko Q5_K_M 17.8G
    validations:
      required: true
  - type: input
    id: params
    attributes:
      label: 分辨率 / 帧数 / 步数
      placeholder: 928x672 / 124 帧 / 4 步
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 耗时（采样时间 + 端到端）
      placeholder: 采样 34s，端到端 85s（首次含模型加载）
    validations:
      required: true
  - type: input
    id: vram
    attributes:
      label: 峰值显存占用
      placeholder: 11.2 GiB（nvidia-smi 观察）
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 补充说明（可选）
      description: 用了哪些加速手段（SLA / SageAttention / 缓存节点 / --lowvram）、踩到的坑、画质评价
    validations:
      required: false
